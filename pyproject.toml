[project]
name = "pentest-pipeline"
version = "0.1.0"
description = "Autonomous pentest orchestration & verification pipeline: Nmap -> Nessus -> Metasploit RPC CVE mapping"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
