# Copy to config.yaml and fill in for --live mode.
# config.yaml is gitignored - never commit real credentials.

nmap:
  path: nmap
  arguments: "-sV -T4 --top-ports 200"

nessus:
  base_url: "https://127.0.0.1:8834"
  access_key: "YOUR_NESSUS_ACCESS_KEY"
  secret_key: "YOUR_NESSUS_SECRET_KEY"
  policy_id: 1               # numeric policy/template ID from your Nessus instance
  verify_ssl: false           # Nessus defaults to a self-signed cert

metasploit:
  host: "127.0.0.1"
  port: 55553
  password: "YOUR_MSFRPCD_PASSWORD"   # start msfrpcd with: msfrpcd -P <password> -a 127.0.0.1 -p 55553
  ssl: false
