services:
  pipeline:
    build: .
    volumes:
      - ./output:/app/output
      - ./config:/app/config:ro
    # Demo mode by default - safe to run with no other setup.
    # For live mode: command: ["--live", "--config", "config/config.yaml", "--targets", "10.0.0.0/24"]
    command: ["--demo", "--output-dir", "/app/output"]
